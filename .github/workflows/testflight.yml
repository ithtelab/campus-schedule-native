name: TestFlight internal testing

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Validate device build, or sign and upload to App Store Connect'
        type: choice
        options: [validate, upload]
        default: validate

permissions:
  contents: read

concurrency:
  group: testflight-publishing
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate project and run rule tests
        run: |
          node scripts/generate-ios-project.mjs
          node scripts/check-preview-config.mjs
          swift test
      - name: Validate device compilation
        if: inputs.action == 'validate'
        run: |
          set -o pipefail
          xcodebuild -project ios/CampusSchedule.xcodeproj -scheme CampusSchedule -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee native-device-build.log
      - name: Sign archive and upload to TestFlight
        if: inputs.action == 'upload'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_ID: ${{ secrets.APPLE_CERTIFICATE_ID }}
          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          APPLE_DISTRIBUTION_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_PASSWORD }}
        run: |
          set -o pipefail
          bash scripts/publish-testflight.sh 2>&1 | tee native-testflight-upload.log
      - name: Save non-secret validation and upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testflight-report
          path: |
            native-device-build.log
            native-testflight-upload.log
            build/testflight-upload.json
          retention-days: 3
          if-no-files-found: warn
